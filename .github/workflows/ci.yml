name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    # A toolchain bump compiles Erlang/OTP on the first run, so allow headroom.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Restore mix cache
        # The otp28 prefix keeps restore-keys from restoring a _build compiled on an older OTP.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-otp28-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-otp28-${{ runner.os }}-

      - name: Run CI
        run: mise run ci
