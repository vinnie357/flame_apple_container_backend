# mise.toml - FLAME Apple Container Backend Development Environment
# Standalone Elixir FLAME backend with Apple Containers support

[tools]
# Core Elixir/Erlang stack
elixir = "1.18.4"         # Latest stable Elixir for FLAME compatibility
erlang = "28"             # Latest Erlang/OTP version

# Supporting development tools
jq = "1.7"               # JSON processing for container introspection

# Apple Containers and development
# Note: Apple Containers installed via Homebrew outside mise

[env]
# Elixir/Phoenix configuration
MIX_ENV = "development"
ELIXIR_ERL_OPTIONS = "+K true +A 16"    # Kernel polling + async threads

# FLAME-specific configuration
FLAME_BACKEND = "apple_containers"       # Use Apple Containers backend
FLAME_LOG_LEVEL = "info"
FLAME_DNS_DOMAIN = "flame.local"         # DNS domain for containers
FLAME_CONTAINER_PREFIX = "flame-dev"     # Container naming prefix
FLAME_MAX_POOLS = "5"                    # Maximum concurrent pools
FLAME_BOOT_TIMEOUT = "180000"            # 3 minutes boot timeout

# Apple Containers specific
CONTAINER_DNS_DOMAIN = "flame.local"
CONTAINER_IMAGE = "flame-worker:dev"
ERLANG_COOKIE = "dev_flame_cookie_secure_random"

# Apple Silicon optimizations
OMP_NUM_THREADS = "8"                    # Optimize for M-series chips
HOMEBREW_NO_AUTO_UPDATE = "1"
HOMEBREW_NO_ANALYTICS = "1"

# Development paths and utilities
TEMP_DIR = "/tmp/flame_processing"
PROJECT_ROOT = "{{ config_root }}"

[tasks.install]
run = [
  "mix local.hex --force",
  "mix local.rebar --force", 
  "mix deps.get",
  "mix deps.compile"
]
description = "Install Elixir dependencies and tools"

[tasks."install:containers"]
run = [
  "echo 'Checking Apple Containers installation...'",
  "if ! command -v container >/dev/null 2>&1; then echo 'Installing Apple Containers...'; brew install --cask containers; fi",
  "container system start --enable-kernel-install || echo 'Container system already running'",
  "echo 'Apple Containers ready'"
]
description = "Install and initialize Apple Containers"

[tasks.setup]
run = ["install", "install:containers", "setup:dns", "setup:containers"]
description = "Complete project setup including Apple Containers"

[tasks."setup:dns"]
run = [
  "echo 'Setting up DNS domain: $FLAME_DNS_DOMAIN'",
  "sudo container system dns create $FLAME_DNS_DOMAIN || echo 'DNS domain already exists'",
  "container system dns default set $FLAME_DNS_DOMAIN",
  "echo 'DNS domain configured successfully'"
]
description = "Set up DNS domain for Apple Containers networking"

[tasks."setup:containers"]
run = [
  "echo 'Building FLAME worker container image...'",
  "if [ -f Dockerfile.flame ]; then container build --tag $CONTAINER_IMAGE --file Dockerfile.flame .; else echo 'Dockerfile.flame not found, skipping image build'; fi",
  "echo 'Container setup complete'"
]
description = "Build FLAME worker container image"

[tasks.start]
run = "mix phx.server"
description = "Start Phoenix development server"

[tasks."start:iex"]
run = "iex -S mix phx.server"
description = "Start Phoenix server with IEx console"

[tasks."start:dev"]
run = [
  "setup:containers",
  "start:iex"
]
description = "Start full development environment with containers"

# FLAME-specific development tasks

[tasks."flame:pools"]
run = "mix eval 'FLAME.Pool.list() |> IO.inspect()'"
description = "List active FLAME pools and their status"

[tasks."flame:containers"]
run = [
  "echo 'Active FLAME containers:'",
  "container list --filter name=$FLAME_CONTAINER_PREFIX",
  "echo ''",
  "echo 'Container resource usage:'",
  "container list --filter name=$FLAME_CONTAINER_PREFIX --quiet | head -3 | xargs -I {} container inspect {} | jq -r '.Name, .State'"
]
description = "Show FLAME containers and their resource usage"

[tasks."flame:test-basic"]
run = """
mix run -e '
result = FLAME.call(FlameAppleContainerBackend.Pool, fn ->
  {node(), System.cmd("hostname", [])}
end)
IO.puts("FLAME basic test result:")
IO.inspect(result)
'
"""
description = "Test basic FLAME functionality with Apple Containers"

[tasks."flame:benchmark"]
run = """
mix run -e '
IO.puts("Starting FLAME benchmark with Apple Containers...")
start_time = System.system_time(:millisecond)

tasks = for i <- 1..10 do
  Task.async(fn ->
    FLAME.call(FlameAppleContainerBackend.Pool, fn ->
      :timer.sleep(500)  # Simulate work
      {node(), i * 2}
    end)
  end)
end

results = Task.await_many(tasks, 30_000)
end_time = System.system_time(:millisecond)

IO.puts("Completed #{length(results)} concurrent FLAME operations")
IO.puts("Total time: #{end_time - start_time}ms")
IO.puts("Average per task: #{(end_time - start_time) / length(results)}ms")
IO.inspect(results)
'
"""
description = "Benchmark FLAME pool performance with Apple Containers"

[tasks."flame:stress"]
run = """
mix run -e '
IO.puts("FLAME stress test - creating containers dynamically...")

# Test pool scaling
for round <- 1..3 do
  IO.puts("Round #{round}: Spawning 5 concurrent tasks...")
  
  tasks = for i <- 1..5 do
    Task.async(fn ->
      FLAME.call(FlameAppleContainerBackend.Pool, fn ->
        # CPU-intensive task
        Enum.reduce(1..100_000, 0, fn i, acc -> acc + i end)
      end)
    end)
  end
  
  results = Task.await_many(tasks, 60_000)
  IO.puts("Round #{round} completed: #{length(results)} tasks")
  
  # Brief pause between rounds
  Process.sleep(2000)
end

IO.puts("Stress test completed")
'
"""
description = "Stress test FLAME pools with container scaling"

# Testing and quality assurance

[tasks.test]
run = "mix test"
description = "Run all tests"

[tasks."test:flame"]
run = "mix test test/flame"
description = "Run FLAME-specific tests only"

[tasks."test:integration"]
run = "mix test --only integration"
description = "Run integration tests with Apple Containers"

[tasks.lint]
run = [
  "mix format --check-formatted",
  "mix credo --strict"
]
description = "Run code formatting and linting checks"

[tasks.format]
run = "mix format"
description = "Format Elixir code"

# Cleanup and maintenance

[tasks."clean:containers"]
run = [
  "echo 'Stopping FLAME containers...'",
  "container list --filter name=$FLAME_CONTAINER_PREFIX --quiet | xargs -r container stop",
  "echo 'FLAME containers cleaned up'"
]
description = "Stop and clean up FLAME containers"

[tasks."clean:all"]
run = [
  "clean:containers",
  "mix clean",
  "rm -rf _build deps",
  "echo 'Full cleanup completed'"
]
description = "Full cleanup of containers and build artifacts"

[tasks."logs:containers"]
run = [
  "echo 'Recent container logs:'",
  "container list --filter name=$FLAME_CONTAINER_PREFIX --quiet | head -5 | xargs -I {} sh -c 'echo \"=== {} ===\"; container logs {} --tail 20'"
]
description = "Show recent logs from FLAME containers"

# Development utilities

[tasks.shell]
run = "iex -S mix"
description = "Start IEx shell with project loaded"

[tasks."docs:generate"]
run = "mix docs"
description = "Generate project documentation"

[tasks."deps:update"]
run = [
  "mix deps.get",
  "mix deps.compile",
  "mix deps.clean --unused"
]
description = "Update and clean dependencies"

# Health checks and monitoring

[tasks."health:system"]
run = [
  "echo '=== System Health Check ==='",
  "echo 'Elixir:' $(elixir --version | head -1)",
  "echo 'Erlang:' $(erl -eval 'erlang:display(erlang:system_info(otp_release)), halt().' -noshell)",
  "echo 'Apple Containers:' $(container --version || echo 'Not available')",
  "echo ''",
  "echo 'DNS Configuration:'",
  "container system dns list || echo 'DNS not configured'",
  "echo ''",
  "echo 'Container Status:'",
  "container list --filter name=$FLAME_CONTAINER_PREFIX || echo 'No FLAME containers'"
]
description = "Check system health and tool versions"

[tasks."health:flame"]
run = """
mix run -e '
IO.puts("=== FLAME Health Check ===")

try do
  pools = FLAME.Pool.list()
  IO.puts("Active pools: #{length(pools)}")
  
  for pool <- pools do
    IO.puts("Pool: #{inspect(pool)}")
  end
  
  # Test basic functionality
  result = FLAME.call(FlameAppleContainerBackend.Pool, fn ->
    "FLAME is working on #{node()}"
  end, timeout: 10_000)
  
  IO.puts("Test result: #{result}")
  IO.puts("FLAME backend is healthy")
rescue
  error ->
    IO.puts("FLAME backend error: #{inspect(error)}")
end
'
"""
description = "Health check for FLAME backend functionality"

# Project information

[tasks.info]
run = [
  "echo 'FLAME Apple Container Backend'",
  "echo ''",
  "echo 'Environment:'",
  "echo '  Mix Environment: $MIX_ENV'",
  "echo '  FLAME Backend: $FLAME_BACKEND'",
  "echo '  DNS Domain: $FLAME_DNS_DOMAIN'",
  "echo '  Container Image: $CONTAINER_IMAGE'",
  "echo ''",
  "echo 'Quick Commands:'",
  "echo '  mise run setup          - Complete project setup'",
  "echo '  mise run start:dev      - Start development environment'",
  "echo '  mise run flame:test-basic - Test FLAME functionality'",
  "echo '  mise run health:system  - System health check'",
  "echo '  mise run clean:containers - Clean up containers'",
  "echo ''",
  "echo 'Documentation: ./README.md'"
]
description = "Show project information and quick reference"
