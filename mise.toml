[env]
_.file = ".env"

[tools]
erlang = "28.5.0.8"
elixir = "1.19.6-otp-28"
gitleaks = "latest"
"github:nushell/nushell" = "0.113.1"

[tasks.deps]
description = "Install dependencies"
run = "mix deps.get"

[tasks.compile]
description = "Compile the project"
run = "mix compile --warnings-as-errors"
depends = ["deps"]

[tasks.test]
description = "Run tests"
run = "mix test"
depends = ["compile"]

[tasks.cover]
description = "Run tests with coverage report"
run = "mix test --cover"
depends = ["compile"]

[tasks.format]
description = "Format code"
run = "mix format"

[tasks.lint]
description = "Check formatting and lint"
run = ["mix format --check-formatted", "mix credo --strict"]
depends = ["compile"]

[tasks.secrets]
description = "Scan for secrets with gitleaks"
run = "gitleaks detect --source . -v"

[tasks.precommit]
description = "Run pre-commit checks (secrets + lint)"
depends = ["secrets", "lint"]

[tasks.docs]
description = "Generate documentation"
run = "mix docs"
depends = ["compile"]

[tasks.hex-build]
description = "Build Hex package"
run = "mix hex.build"
depends = ["compile"]

[tasks."audit:hex"]
description = "Run mix hex.audit on Hex >= 2.5.3; fail on any advisory or retirement not allow-listed in mix.exs, or on a stale allow-list entry. Needs network."
depends = ["deps"]
run = "nu scripts/hex-audit.nu"

[tasks."audit:deps"]
description = "Run mix deps.audit (mix_audit, mirego DB) unfiltered; fail on unskipped or stale .mix-audit-ignore entries, a missing or unreadable mix.lock, an empty DB, or a blind positive control. Needs network."
depends = ["audit:hex"]
run = "nu scripts/deps-audit.nu"

[tasks."audit:advisory-doc"]
description = "Fail when a docs/security/advisory-exceptions.md section's Next review date is overdue, missing or unparseable"
run = "nu scripts/advisory-doc.nu"

[tasks."test:hex-audit"]
description = "Fixture tests for the scripts/hex-audit.nu decision defs and its main"
run = "nu test/test-hex-audit.nu"

[tasks."test:hex-audit-offline"]
description = "audit:hex must fail on a registry cache fallback and force HEX_OFFLINE=false"
run = "nu test/test-hex-audit-offline.nu"

[tasks."test:deps-audit"]
description = "Fixture and fake-mix tests for scripts/deps-audit.nu"
run = "nu test/test-deps-audit.nu"

[tasks."test:audit-wiring"]
description = "Audit task wiring, allow-list parity between mix.exs and .mix-audit-ignore, and the STRIDE doc structure"
run = "nu test/test-audit-wiring.nu"

[tasks."audit:otp"]
description = "Fail when the mise.toml erlang pin, the running ERTS, or the OTP in docs/examples/Dockerfile.flame is below the OTP floor (28.5.0.8), or the runtime or image differs from the pin"
run = "nu scripts/otp-audit.nu --image-file docs/examples/Dockerfile.flame"

[tasks."test:otp-audit"]
description = "Fixture and fake-erl tests for scripts/otp-audit.nu"
run = "nu test/test-otp-audit.nu"

[tasks."test:advisory-doc"]
description = "Tests for scripts/advisory-doc.nu review-date check"
run = "nu test/test-advisory-doc.nu"

[tasks.ci]
description = "Run CI checks (secrets, lint, advisory audits and their tests, compile, test)"
depends = ["secrets", "lint", "audit:hex", "audit:deps", "audit:advisory-doc", "test:hex-audit", "test:hex-audit-offline", "test:deps-audit", "test:audit-wiring", "test:advisory-doc", "audit:otp", "test:otp-audit"]
run = ["mix compile --warnings-as-errors", "mix test"]
