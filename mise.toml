[env]
_.file = ".env"

[tools]
erlang = "27"
elixir = "1.19.5-otp-27"
gitleaks = "latest"

[tasks.deps]
description = "Install dependencies"
run = "mix deps.get"

[tasks.compile]
description = "Compile the project"
run = "mix compile --warnings-as-errors"
depends = ["deps"]

[tasks.test]
description = "Run tests"
run = "mix test"
depends = ["compile"]

[tasks.cover]
description = "Run tests with coverage report"
run = "mix test --cover"
depends = ["compile"]

[tasks.format]
description = "Format code"
run = "mix format"

[tasks.lint]
description = "Check formatting and lint"
run = ["mix format --check-formatted", "mix credo --strict"]
depends = ["compile"]

[tasks.secrets]
description = "Scan for secrets with gitleaks"
run = "gitleaks detect --source . -v"

[tasks.precommit]
description = "Run pre-commit checks (secrets + lint)"
depends = ["secrets", "lint"]

[tasks.docs]
description = "Generate documentation"
run = "mix docs"
depends = ["compile"]

[tasks.hex-build]
description = "Build Hex package"
run = "mix hex.build"
depends = ["compile"]

[tasks.ci]
description = "Run CI checks (secrets, lint, compile, test)"
depends = ["secrets", "lint"]
run = ["mix compile --warnings-as-errors", "mix test"]
